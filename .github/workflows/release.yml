name: Release signed image
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  publish:
    if: vars.RELEASE_ENABLED == 'true' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    needs: verify
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Derive this repository's registry path
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the exact image that will be scanned and pushed
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Gate publishing on the freshly built image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          ignore-unfixed: false
          exit-code: '1'
      - name: Runtime image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          syft-version: v1.55.0
          format: cyclonedx-json
          output-file: image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Locked frontend dependency SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: frontend
          syft-version: v1.55.0
          format: cyclonedx-json
          output-file: frontend.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned local image and capture its immutable digest
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:sha-$GITHUB_SHA"
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")"
          [[ "$reference" =~ ^"$IMAGE"@sha256:[a-f0-9]{64}$ ]]
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"
          echo "$reference" > image-reference.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and verify the digest using the GitHub OIDC identity
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          reference="$IMAGE@$DIGEST"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign --yes "$reference"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$reference" > image-signature-verification.json
          cosign attest --yes --type cyclonedx --predicate image.cdx.json "$reference"
          cosign verify-attestation --type cyclonedx --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$reference" > image-sbom-verification.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest runtime SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image.cdx.json
          push-to-registry: true
      - name: Attest frontend dependency inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: frontend.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-${{ github.sha }}
          path: |
            image-reference.txt
            image.cdx.json
            frontend.cdx.json
            image-signature-verification.json
            image-sbom-verification.json
          retention-days: 90
      - name: Record reviewable deployment input
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: printf 'Released `%s@%s` from `%s`. Use the protected Deploy workflow with this digest and ref.\n' "$IMAGE" "$DIGEST" "$GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
