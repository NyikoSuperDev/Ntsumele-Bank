<section class="overview-grid"><div class="overview-accounts"><div class="section-heading"><h2>Your accounts</h2><span>{{accounts().length}} accounts</span></div>@for(a of accounts();track a.id){<button class="account-overview" (click)="accountSelected.emit(a.id)"><span class="summary-icon primary-tone"><nb-icon name="wallet"/></span><div><strong>{{a.name}}</strong><span>{{a.maskedNumber}}</span></div><div class="account-overview-amount"><strong>{{money(a.balance,a.currency)}}</strong><span>Available balance</span></div><nb-icon name="chevron"/></button>}</div><div class="peace-card"><span class="peace-icon"><nb-icon name="shield"/></span><span class="eyebrow">LET’S PUT THINGS RIGHT</span><h2>Something<br>doesn’t add up?</h2><p>Find the transaction and tell us what happened. We’ll keep you updated at every step.</p><button class="button primary" (click)="viewTransactions.emit()">View transactions<nb-icon name="arrow"/></button></div></section>
