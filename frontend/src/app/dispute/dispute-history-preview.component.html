@if(activeDisputes.length){<section class="panel"><div class="section-heading padded"><h2>Cases in progress</h2><button class="text-button" (click)="viewAll.emit()">View all cases <nb-icon name="arrow"/></button></div>@for(d of activeDisputes;track d.id){<button class="case-preview" (click)="caseSelected.emit(d.id)"><span class="merchant-mark">{{merchantInitials(d.transaction.merchant)}}</span><div><strong>{{d.transaction.merchant}}</strong><span>{{d.caseReference}}</span></div><span class="badge" [attr.data-status]="d.status">{{label(d.status)}}</span><nb-icon name="chevron"/></button>}</section>}
